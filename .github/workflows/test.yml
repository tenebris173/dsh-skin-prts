name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 启动 headless Chrome（CDP 9222）
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --remote-debugging-port=9222 --user-data-dir=/tmp/cdp about:blank &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9222/json/version

      - name: 皮肤集成测试（真实浏览器引擎跑真实 bundle）
        run: node tests/browser-smoke.mjs

      - name: 多皮肤亮暗开关冲突（同时 standalone）
        run: node tests/scheme-conflict.mjs

      - name: 控制台等待 / 自立模式测试
        run: node tests/console-wait.mjs

      - name: 皮肤选择器测试
        run: node tests/skin-selector.mjs

      - name: 对比度测试（每个强调色 × 每种底）
        run: node tests/contrast.mjs

      - name: 依赖自检（缺皮肤加载器时必须给出提示）
        run: node tests/dependency-check.mjs

      - name: 语法检查
        run: node --check lib/client.js && node --check lib/index.js
